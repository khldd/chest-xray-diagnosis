# Default training configuration. Override with: python -m src.train --config configs/<file>.yaml
data:
  root: /kaggle/input/datasets/nih-chest-xrays/data
  val_fraction: 0.15
  seed: 42
  img_size: 224
  batch_size: 32
  num_workers: 2
  augmentation: flip        # none | flip | strong
  cache: false              # pre-resize all images once into a memmap (see src/data/cache.py)
  cache_dir: /kaggle/working/cache
  cache_workers: 4

model:
  name: densenet121         # densenet121 | resnet50 | efficientnet_b0 | convnext_tiny
  pretrained: true
  freeze_backbone: false

train:
  epochs: 15
  lr: 0.0001
  loss: weighted_bce        # weighted_bce | bce
  output_dir: /kaggle/working
  mlflow_experiment: chest-xray
  seed: 0                   # torch / numpy / shuffle seed (the patient split uses data.seed)
  amp: false                # mixed precision on GPU
  predict: false            # save val/test predictions of the best checkpoint
  localize: false           # score Grad-CAM against the NIH expert boxes
