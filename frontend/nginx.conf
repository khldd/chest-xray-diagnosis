server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Slightly above the API's 10 MB upload limit so the API returns its own clear 413.
    client_max_body_size 12m;

    # /api/* -> FastAPI (the trailing slash on proxy_pass strips the /api prefix).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        # The first Grad-CAM call after startup loads torch and the model (7-13 s).
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
